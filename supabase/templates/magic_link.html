<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#F2F3F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#14161B">
    <!--
      Supabase's default magic-link template sends a clickable link and never
      shows the code. The app asks for a six-digit code on /verify (OTP.dc.html),
      so this template leads with {{ .Token }}.

      The link is kept as a fallback for anyone who would rather click than
      type, and because a code with no link is a dead end on a device where
      the app is not already open.
    -->
    <div style="max-width:420px;margin:0 auto;background:#FCFCFD;border-radius:20px;padding:32px">
      <p style="margin:0;font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#3A2FD6">
        // Your Venn code
      </p>

      <p style="margin:24px 0 8px;font-size:15px;line-height:1.6;color:#5A6072">
        Enter this code to sign in:
      </p>

      <p style="margin:0;font-size:36px;font-weight:700;letter-spacing:0.18em;color:#14161B">
        {{ .Token }}
      </p>

      <p style="margin:20px 0 0;font-size:14px;line-height:1.6;color:#5A6072">
        It expires in an hour and can only be used once. If you didn't ask for
        it, you can ignore this email.
      </p>

      <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#5A6072">
        Or <a href="{{ .ConfirmationURL }}" style="color:#335CFF">sign in with this link</a>.
      </p>
    </div>
  </body>
</html>
