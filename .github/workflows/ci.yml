name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. Nothing here is a
# deployment, so an in-flight run on an old commit is only burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · lint · build
    runs-on: ubuntu-latest

    # Placeholders of the right SHAPE, not credentials. No route connects to
    # Supabase during a build or a typegen, because every page that reads data
    # is dynamic — so a real key here would be a secret in a log for no
    # benefit. Set at job level so every step has them, not just the build.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CRON_SECRET: ci-placeholder-cron-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs `next typegen` first. LayoutProps and PageProps are GENERATED
      # into .next/types, which is gitignored, so a bare `tsc --noEmit` on a
      # fresh checkout cannot see them and fails on every layout in the app.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

# --- Not here: the database job --------------------------------------------
#
# `supabase start` + `supabase test db` on a runner would replay all thirteen
# migrations from empty and run the pgTAP RLS suite. It is out for now by
# choice: run it locally instead, with
#
#     npm run db:reset && npm run db:test
#
# The schema replay itself worked on the runner; what failed was the mail
# container, which could not bind port 54424 because something on the runner
# already held it. The suite does not need mail, so the fix if this comes
# back is one flag:
#
#     supabase start -x mailpit
#
# Worth restoring before launch. RLS is the whole authorization boundary
# (docs/ARCHITECTURE.md §3.2), so until this job exists, nothing automated
# checks that one user cannot read another's rows — a green CI here means the
# app compiles, and says nothing about whether it leaks.
