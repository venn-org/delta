<style>
body{margin:0}
a{color:#335CFF}a:hover{color:#8A5BFF}
@keyframes vpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes vl{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
@keyframes vr{0%{transform:translateX(0)}50%{transform:translateX(-26px)}100%{transform:translateX(0)}}
@keyframes vdot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes vfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes vgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes vshine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.vb,.vc{animation:vfade .5s cubic-bezier(.2,.8,.2,1) both}
.vb:nth-child(2),.vc:nth-child(2){animation-delay:.08s}.vb:nth-child(3),.vc:nth-child(3){animation-delay:.16s}.vb:nth-child(4),.vc:nth-child(4){animation-delay:.24s}.vb:nth-child(5),.vc:nth-child(5){animation-delay:.32s}.vb:nth-child(6),.vc:nth-child(6){animation-delay:.4s}.vb:nth-child(7),.vc:nth-child(7){animation-delay:.48s}.vb:nth-child(8),.vc:nth-child(8){animation-delay:.56s}.vb:nth-child(n+9),.vc:nth-child(n+9){animation-delay:.64s}
.vgrow{transform-origin:left;animation:vgrow .9s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes vdrift{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,14px)}}
.vblobA{animation:vdrift 14s ease-in-out infinite}.vblobB{animation:vdrift 16s ease-in-out infinite reverse}
.vfloat{animation:vfloat 6s ease-in-out infinite}
.vpct{animation:vshine 3s ease-in-out infinite}
button,a{transition:transform .15s ease,opacity .15s ease,box-shadow .2s ease,background-color .2s ease}
button:hover{transform:translateY(-1px)}button:active{transform:scale(.98);opacity:.85}
article{transition:transform .2s ease,box-shadow .2s ease}article:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
