<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report / block sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#335CFF}a:hover{color:#8A5BFF}
@keyframes vpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes vl{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
@keyframes vr{0%{transform:translateX(0)}50%{transform:translateX(-26px)}100%{transform:translateX(0)}}
@keyframes vdot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes vfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes vgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes vshine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.vb,.vc{animation:vfade .5s cubic-bezier(.2,.8,.2,1) both}
.vb:nth-child(2),.vc:nth-child(2){animation-delay:.08s}.vb:nth-child(3),.vc:nth-child(3){animation-delay:.16s}.vb:nth-child(4),.vc:nth-child(4){animation-delay:.24s}.vb:nth-child(5),.vc:nth-child(5){animation-delay:.32s}.vb:nth-child(6),.vc:nth-child(6){animation-delay:.4s}.vb:nth-child(7),.vc:nth-child(7){animation-delay:.48s}.vb:nth-child(8),.vc:nth-child(8){animation-delay:.56s}.vb:nth-child(n+9),.vc:nth-child(n+9){animation-delay:.64s}
.vgrow{transform-origin:left;animation:vgrow .9s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes vdrift{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,14px)}}
.vblobA{animation:vdrift 14s ease-in-out infinite}.vblobB{animation:vdrift 16s ease-in-out infinite reverse}
.vfloat{animation:vfloat 6s ease-in-out infinite}
.vpct{animation:vshine 3s ease-in-out infinite}
button,a{transition:transform .15s ease,opacity .15s ease,box-shadow .2s ease,background-color .2s ease}
button:hover{transform:translateY(-1px)}button:active{transform:scale(.98);opacity:.85}
article{transition:transform .2s ease,box-shadow .2s ease}article:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;color:#14161B;background:#F2F3F7;position:relative">
<div style="height:100%;position:relative;background:#F2F3F7"><div style="position:absolute;inset:0;background:rgba(0,0,0,.4)"></div>
<div role="dialog" aria-label="Report or block Kabir" style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:12px 20px 28px;display:flex;flex-direction:column;gap:12px">
<div style="width:40px;height:4px;border-radius:50px;background:#E6E8EE;margin:0 auto 6px"></div>
<h2 style="font-family:'Space Grotesk',sans-serif;letter-spacing:-0.03em;font-size:22px;margin:0">What's going on with Kabir?</h2><p style="margin:0;font-size:14px;color:#5A6072">He won't know you reported him. Our team reviews every report within 24 hours.</p>
<fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend style="position:absolute;width:1px;height:1px;overflow:hidden">Reason</legend>
<label style="display:flex;gap:12px;align-items:center;border:1.5px solid #E6E8EE;border-radius:16px;padding:14px;font-size:15px;min-height:24px"><input type="radio" name="r"  style="accent-color:#335CFF;width:18px;height:18px">Fake profile or listing</label><label style="display:flex;gap:12px;align-items:center;border:2px solid #335CFF;border-radius:16px;padding:14px;font-size:15px;min-height:24px"><input type="radio" name="r" checked style="accent-color:#335CFF;width:18px;height:18px">Asked for money / deposit upfront</label><label style="display:flex;gap:12px;align-items:center;border:1.5px solid #E6E8EE;border-radius:16px;padding:14px;font-size:15px;min-height:24px"><input type="radio" name="r"  style="accent-color:#335CFF;width:18px;height:18px">Rude or harassing messages</label><label style="display:flex;gap:12px;align-items:center;border:1.5px solid #E6E8EE;border-radius:16px;padding:14px;font-size:15px;min-height:24px"><input type="radio" name="r"  style="accent-color:#335CFF;width:18px;height:18px">Something else</label></fieldset>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px"><button type="button" style="background:#14161B;color:#fff;border:0;border-radius:50px;padding:14px 22px;font:700 16px 'Hanken Grotesk',sans-serif;min-height:52px;width:100%;cursor:pointer">Report</button><button type="button" style="background:none;border:0;color:#E5304F;font:700 15px 'Hanken Grotesk',sans-serif;min-height:48px">Just block Kabir</button></div></div></div>
<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50"><div class="vblobA" style="position:absolute;width:429px;height:429px;border-radius:50%;background:#335CFF;opacity:.09;filter:blur(30px);left:-175px;top:-156px"></div><div class="vblobB" style="position:absolute;width:390px;height:390px;border-radius:50%;background:#8A5BFF;opacity:.09;filter:blur(30px);right:-156px;bottom:-136px"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
