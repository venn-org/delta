@keyframes vpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}

@keyframes vfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes vshine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.vb,.vc{animation:vfade .5s cubic-bezier(.2,.8,.2,1) both}

.vfloat{animation:vfloat 6s ease-in-out infinite}
.vpct{animation:vshine 3s ease-in-out infinite}
button,a{transition:transform .15s ease,opacity .15s ease,box-shadow .2s ease,background-color .2s ease}
button:hover{transform:translateY(-1px)}button:active{transform:scale(.98);opacity:.85}
